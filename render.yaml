# Render Blueprint: THE CNM company website (static site)
services:
  - type: web
    runtime: static
    name: creativemore-site
    buildCommand: echo "static site, no build step"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    domains:
      - www.creativemore.co.kr
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: redirect
        source: /bbs/*
        destination: /work/
      - type: redirect
        source: /data/*
        destination: /work/
      - type: redirect
        source: /theme/CNM/img/The_CNM_2025.pdf
        destination: /company-profile.pdf
      - type: redirect
        source: /theme/*
        destination: /
      - type: redirect
        source: /index.php
        destination: /
      - type: redirect
        source: /about
        destination: /about/
      - type: redirect
        source: /atl
        destination: /atl/
